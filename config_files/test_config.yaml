# File paths
default_rs_filepath: ./reference_standards/rs_ctDNA.csv
default_samples_filepath: ./reference_samples.csv
variant_file_path: /{base_dir}/{sample_id}_variants.tsv
fusion_file_path: /{base_dir}/{sample_id}_fusion_check.csv
HD728_reference_file: 'reference_standards/TruQ1_RS_HD728.txt'
